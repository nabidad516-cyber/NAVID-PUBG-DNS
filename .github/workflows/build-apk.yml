name: Build NAVID PUBG DNS APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build NAVID PUBG DNS APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP NOT FOUND"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ANDROID PROJECT NOT FOUND"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDKMANAGER NOT FOUND"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android packages
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fix Java and Kotlin versions
        run: |
          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            APP_FILE="$PROJECT_DIR/app/build.gradle.kts"
            KTS=1
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            APP_FILE="$PROJECT_DIR/app/build.gradle"
            KTS=0
          else
            echo "APP GRADLE FILE NOT FOUND"
            exit 1
          fi

          echo "Using: $APP_FILE"

          # 1) Replace any old 1.8 / 8 values with 17
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$APP_FILE"
          sed -i 's/JavaVersion.VERSION_1_7/JavaVersion.VERSION_17/g' "$APP_FILE"
          sed -i 's/jvmTarget *= *"1.8"/jvmTarget = "17"/g' "$APP_FILE"
          sed -i 's/jvmTarget *= *"8"/jvmTarget = "17"/g' "$APP_FILE"
          sed -i "s/jvmTarget *= *'1.8'/jvmTarget = '17'/g" "$APP_FILE"

          # 2) Append a final android block so 17 wins
          if [ "$KTS" = "1" ]; then
            cat >> "$APP_FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          else
            cat >> "$APP_FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          fi

          echo "Java and Kotlin targets set to 17"
          grep -n "VERSION_\|jvmTarget" "$APP_FILE" || true

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Check APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK NOT GENERATED"
            exit 1
          fi

          echo "APK SUCCESS: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAVID-PUBG-DNS-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
